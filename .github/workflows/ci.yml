name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/bazel-disk-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'requirements_lock.txt') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'requirements_lock.txt') }}-
            bazel-${{ runner.os }}-

      - name: Install Bazelisk
        shell: pwsh
        run: |
          if (-not (Get-Command bazelisk -ErrorAction SilentlyContinue)) { choco install bazelisk --version=1.29.0 -y }

      - name: Package guard
        shell: pwsh
        run: bazelisk run //tools/git:check_packages

      - name: Test
        shell: pwsh
        run: bazelisk test //... "--disk_cache=$HOME/bazel-disk-cache"

      - name: Commit messages
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: bazelisk run //tools/git:check_commit_msg -- --range origin/main..HEAD
