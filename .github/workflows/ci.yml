name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Restore Bazel disk cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/bazel-disk-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'requirements_lock.txt') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'requirements_lock.txt') }}-
            bazel-${{ runner.os }}-

      - name: Install Bazelisk
        shell: pwsh
        run: |
          if (-not (Get-Command bazelisk -ErrorAction SilentlyContinue)) { choco install bazelisk --version=1.29.0 -y }

      - name: Package guard
        shell: pwsh
        run: bazelisk run //tools/git:check_packages

      - name: Test
        shell: pwsh
        run: bazelisk test //... "--disk_cache=$HOME/bazel-disk-cache"

      - name: Commit messages
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: bazelisk run //tools/git:check_commit_msg -- --range origin/main..HEAD

      - name: Commit messages (push to main)
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before != github.sha
        shell: bash
        run: bazelisk run //tools/git:check_commit_msg -- --range ${{ github.event.before }}..${{ github.sha }}

      - name: Save Bazel disk cache
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/bazel-disk-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'requirements_lock.txt') }}-${{ github.sha }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit pinned dependencies for known vulnerabilities
        run: pipx run pip-audit==2.10.1 --requirement requirements_lock.txt --require-hashes --disable-pip --strict
